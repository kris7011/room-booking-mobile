name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, tests and Expo Doctor
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Smoke-test API target switching script
        shell: pwsh
        run: |
          @(
            'EXPO_PUBLIC_API_URL=http://localhost:5003'
            'EXPO_PUBLIC_ENTRA_CLIENT_ID=preserve-me'
            'EXPO_PUBLIC_ENTRA_API_SCOPE=api://example/access_as_user'
          ) | Set-Content .env.local
          ./scripts/Set-ApiTarget.ps1 -Mode Hosted -HostedUrl 'https://example.org/'
          $contents = Get-Content .env.local -Raw
          if ($contents -notmatch 'EXPO_PUBLIC_API_URL=https://example.org') { throw 'Hosted target missing' }
          if ($contents -notmatch 'EXPO_PUBLIC_ENTRA_CLIENT_ID=preserve-me') { throw 'Entra ID changed' }
          ./scripts/Set-ApiTarget.ps1 -Mode Local
          $contents = Get-Content .env.local -Raw
          if ($contents -notmatch 'EXPO_PUBLIC_API_URL=http://localhost:5003') { throw 'Local target missing' }
          $rejected = $false
          try {
            ./scripts/Set-ApiTarget.ps1 -Mode Hosted -HostedUrl 'http://example.org'
          } catch {
            $rejected = $true
          }
          if (-not $rejected) { throw 'Insecure hosted target was accepted' }
          Remove-Item -LiteralPath .env.local -Force

      - name: Type-check app and tests
        run: npm run typecheck

      # Fails on any ESLint error or warning (eslint.config.js).
      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Run Expo Doctor
        run: npx expo-doctor
